# Requiere .env.production (generar: sh scripts/bootstrap-production-env.sh --force)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: /reservas
        # Usar IP mientras el DNS de lacasonadefutrono.cl no esté activo
        # (este link aparece en el header "Volver al sitio web")
        NEXT_PUBLIC_WEBSITE_URL: http://178.104.214.147
        # APP_URL solo se usa en meta tags SEO (canonical, OG), no afecta funcionalidad
        NEXT_PUBLIC_APP_URL: https://lacasonadefutrono.cl
        NEXT_PUBLIC_SHOW_DEMO_UI: "false"
        NEXT_PUBLIC_DISPLAY_CURRENCY: CLP
        NEXT_PUBLIC_WHATSAPP_NUMBER: "56900000000"
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
