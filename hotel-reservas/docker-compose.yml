# Requiere .env.production (generar: sh scripts/bootstrap-production-env.sh --force)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: /reservas
        # Dominio público de la landing (link "Volver al sitio web")
        NEXT_PUBLIC_WEBSITE_URL: https://lacasonadefutrono.cl
        NEXT_PUBLIC_APP_URL: https://lacasonadefutrono.cl
        NEXT_PUBLIC_SHOW_DEMO_UI: "false"
        NEXT_PUBLIC_DISPLAY_CURRENCY: CLP
        NEXT_PUBLIC_WHATSAPP_NUMBER: "56998218978"
        # Módulos opcionales: false hasta que el cliente los contrate
        NEXT_PUBLIC_FEATURE_MENU: "false"
        NEXT_PUBLIC_FEATURE_EXPERIENCES: "false"
        NEXT_PUBLIC_FEATURE_REPORTS: "false"
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    volumes:
      # Persiste las fotos subidas desde el panel admin entre rebuilds/recreates.
      - uploads_data:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
