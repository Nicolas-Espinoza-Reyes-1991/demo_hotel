# Motor de reservas — reservas.adkiniq.cl (activar cuando tengas DNS)
# Requiere certificado SSL para HTTPS (certbot)

server {
    listen 80;
    server_name reservas.adkiniq.cl;

    location / {
        # Permite subir fotos de habitaciones desde el panel admin (máx. 8 MB en la app).
        client_max_body_size 10m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
