# Landing + motor de reservas por IP (puerto 80)
# Instalar: ver deploy/nginx/README.md

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _ hotel.adkiniq.cl;

    root /var/www/demo_hotel;
    index propuesta-7-casona-futrono.html;

    # ^~ evita que el location regex de .css/.js capture /reservas/_next/*
    location ^~ /reservas {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /propuesta-7-casona-futrono.html;
    }

    # Solo assets estáticos de la landing (fotos_web, assets/) — no /reservas/_next
    location ~* ^/(assets|fotos_web)/.*\.(css|js|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
