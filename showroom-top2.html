<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Showroom Top 2 | Adkin IQ</title>
    <script src="https://cdn.tailwindcss.com"></script>
      <link rel="stylesheet" href="./assets/adkin-mobile-ux.css" />
    <script defer src="./assets/adkin-mobile-ux.js"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100 adkin-demo">
    <header class="border-b border-white/10 bg-slate-950/95 backdrop-blur">
      <div class="mx-auto flex max-w-7xl flex-col gap-4 px-4 py-4 sm:px-6 lg:px-8">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div>
            <p class="text-xs font-semibold uppercase tracking-[0.18em] text-cyan-300">Adkin IQ · Modo Showroom</p>
            <h1 class="text-2xl font-bold">Presentación automática Top 2</h1>
          </div>
          <div class="flex flex-wrap gap-2">
            <a href="./pitch-top2-adkin-iq.html" class="rounded-lg border border-slate-600 px-3 py-2 text-sm font-medium text-slate-200 transition hover:bg-slate-800">Volver al pitch</a>
            <a id="openCurrent" href="./propuesta-5-sunset-lifestyle.html" target="_blank" rel="noopener noreferrer" class="rounded-lg bg-violet-600 px-3 py-2 text-sm font-semibold text-white transition hover:bg-violet-700">Abrir demo actual</a>
          </div>
        </div>

        <div class="adkin-showroom-controls flex flex-wrap items-center gap-2">
          <button id="startBtn" class="rounded-lg bg-emerald-600 px-3 py-2 text-sm font-semibold text-white transition hover:bg-emerald-700">Iniciar showroom</button>
          <button id="prevBtn" class="rounded-lg border border-slate-600 px-3 py-2 text-sm font-medium text-slate-200 transition hover:bg-slate-800">Anterior</button>
          <button id="toggleBtn" class="rounded-lg border border-slate-600 px-3 py-2 text-sm font-medium text-slate-200 transition hover:bg-slate-800">Pausar</button>
          <button id="nextBtn" class="rounded-lg border border-slate-600 px-3 py-2 text-sm font-medium text-slate-200 transition hover:bg-slate-800">Siguiente</button>
          <button id="autoscrollBtn" class="rounded-lg border border-cyan-500/60 bg-cyan-500/15 px-3 py-2 text-sm font-medium text-cyan-200 transition hover:bg-cyan-500/25">Autoscroll: ON</button>
          <button id="fullscreenBtn" class="rounded-lg border border-slate-600 px-3 py-2 text-sm font-medium text-slate-200 transition hover:bg-slate-800">Pantalla completa</button>
          <span id="statusText" class="adkin-showroom-status ml-2 text-sm text-slate-300">Listo para iniciar.</span>
        </div>

        <div class="h-2 w-full overflow-hidden rounded-full bg-slate-800">
          <div id="progressBar" class="h-full w-0 bg-gradient-to-r from-fuchsia-500 to-violet-500 transition-[width] duration-500"></div>
        </div>
      </div>
    </header>

    <main class="mx-auto max-w-7xl px-4 py-4 sm:px-6 lg:px-8">
      <div class="overflow-hidden rounded-2xl border border-white/10 bg-black shadow-2xl">
        <iframe id="demoFrame" src="./propuesta-5-sunset-lifestyle.html" title="Showroom de demos hoteleras" class="adkin-showroom-iframe w-full bg-white"></iframe>
      </div>
    </main>

    <script>
      const demos = [
        { name: "Demo 5 · Riviera Atelier", url: "./propuesta-5-sunset-lifestyle.html" },
        { name: "Demo 6 · Avant / Neon", url: "./propuesta-6-neon-future-experience.html" }
      ];

      const ROTATION_MS = 20000;
      let currentIndex = 0;
      let playing = true;
      let remainingMs = ROTATION_MS;
      let lastTick = Date.now();
      let timer = null;
      let autoscrollEnabled = true;
      let autoscrollTimer = null;
      let autoscrollDirection = 1;

      const frame = document.getElementById("demoFrame");
      const progressBar = document.getElementById("progressBar");
      const statusText = document.getElementById("statusText");
      const openCurrent = document.getElementById("openCurrent");
      const toggleBtn = document.getElementById("toggleBtn");
      const autoscrollBtn = document.getElementById("autoscrollBtn");

      function render() {
        const demo = demos[currentIndex];
        frame.src = demo.url;
        openCurrent.href = demo.url;
        statusText.textContent = `${demo.name} · Cambio automático en ${Math.ceil(remainingMs / 1000)}s`;
      }

      function stopAutoscroll() {
        if (autoscrollTimer) {
          clearInterval(autoscrollTimer);
          autoscrollTimer = null;
        }
      }

      function startAutoscroll() {
        stopAutoscroll();
        if (!autoscrollEnabled) return;

        // Espera breve para asegurar que el iframe renderizó el layout.
        setTimeout(() => {
          try {
            const w = frame.contentWindow;
            if (!w || !w.document || !w.document.body) return;
            w.scrollTo({ top: 0, behavior: "auto" });
            autoscrollDirection = 1;

            autoscrollTimer = setInterval(() => {
              if (!autoscrollEnabled || !playing) return;
              const maxScroll = Math.max(
                0,
                (w.document.documentElement ? w.document.documentElement.scrollHeight : 0) - w.innerHeight
              );
              const y = w.scrollY || 0;
              const step = 2.2;

              if (maxScroll <= 10) return;
              if (y >= maxScroll - 8) autoscrollDirection = -1;
              if (y <= 0) autoscrollDirection = 1;

              w.scrollTo({ top: y + step * autoscrollDirection, behavior: "auto" });
            }, 40);
          } catch (e) {
            stopAutoscroll();
          }
        }, 1000);
      }

      function setProgress() {
        const elapsed = ROTATION_MS - remainingMs;
        const pct = Math.min(100, Math.max(0, (elapsed / ROTATION_MS) * 100));
        progressBar.style.width = `${pct}%`;
      }

      function nextDemo() {
        currentIndex = (currentIndex + 1) % demos.length;
        remainingMs = ROTATION_MS;
        setProgress();
        render();
        startAutoscroll();
      }

      function prevDemo() {
        currentIndex = (currentIndex - 1 + demos.length) % demos.length;
        remainingMs = ROTATION_MS;
        setProgress();
        render();
        startAutoscroll();
      }

      function tick() {
        if (!playing) return;
        const now = Date.now();
        const delta = now - lastTick;
        lastTick = now;
        remainingMs -= delta;
        if (remainingMs <= 0) {
          nextDemo();
        } else {
          setProgress();
          statusText.textContent = `${demos[currentIndex].name} · Cambio automático en ${Math.ceil(remainingMs / 1000)}s`;
        }
      }

      function startLoop() {
        if (timer) clearInterval(timer);
        lastTick = Date.now();
        timer = setInterval(tick, 250);
      }

      document.getElementById("startBtn").addEventListener("click", () => {
        playing = true;
        remainingMs = ROTATION_MS;
        toggleBtn.textContent = "Pausar";
        render();
        startLoop();
        startAutoscroll();
      });

      document.getElementById("toggleBtn").addEventListener("click", () => {
        playing = !playing;
        toggleBtn.textContent = playing ? "Pausar" : "Reanudar";
        statusText.textContent = playing
          ? `${demos[currentIndex].name} · Cambio automático en ${Math.ceil(remainingMs / 1000)}s`
          : `${demos[currentIndex].name} · En pausa`;
        if (playing) lastTick = Date.now();
      });

      document.getElementById("autoscrollBtn").addEventListener("click", () => {
        autoscrollEnabled = !autoscrollEnabled;
        autoscrollBtn.textContent = autoscrollEnabled ? "Autoscroll: ON" : "Autoscroll: OFF";
        autoscrollBtn.className = autoscrollEnabled
          ? "rounded-lg border border-cyan-500/60 bg-cyan-500/15 px-3 py-2 text-sm font-medium text-cyan-200 transition hover:bg-cyan-500/25"
          : "rounded-lg border border-slate-600 px-3 py-2 text-sm font-medium text-slate-300 transition hover:bg-slate-800";
        if (autoscrollEnabled) {
          startAutoscroll();
          statusText.textContent = `${demos[currentIndex].name} · Autoscroll activado`;
        } else {
          stopAutoscroll();
          statusText.textContent = `${demos[currentIndex].name} · Autoscroll desactivado`;
        }
      });

      document.getElementById("nextBtn").addEventListener("click", () => {
        nextDemo();
      });

      document.getElementById("prevBtn").addEventListener("click", () => {
        prevDemo();
      });

      document.getElementById("fullscreenBtn").addEventListener("click", () => {
        const root = document.documentElement;
        if (!document.fullscreenElement) {
          root.requestFullscreen();
        } else {
          document.exitFullscreen();
        }
      });

      setProgress();
      render();
      startLoop();
      frame.addEventListener("load", () => {
        startAutoscroll();
      });
    </script>
  </body>
</html>
