name: CI

on:
  push:
    paths:
      - "hotel-reservas/**"
  pull_request:
    paths:
      - "hotel-reservas/**"

defaults:
  run:
    working-directory: hotel-reservas

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hotel_reservas_test?schema=public
  AUTH_SECRET: ci-test-secret-minimum-32-characters-long

jobs:
  unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hotel_reservas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hotel-reservas/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hotel_reservas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hotel-reservas/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
          ALLOW_SIMULATED_PAYMENT: "true"
          BANK_TRANSFER_ENABLED: "true"
          BANK_NAME: Banco E2E Test
          BANK_ACCOUNT_HOLDER: La Casona de Futrono E2E
          BANK_ACCOUNT_NUMBER: "000111222333444"
          BANK_CONTACT_EMAIL: e2e@hotel.test
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: admin123
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: hotel-reservas/playwright-report/
          retention-days: 7
